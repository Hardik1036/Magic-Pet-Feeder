<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Rexy & Friends - 3D Interactive Baby Pet</title>
  
  <!-- Modern playful typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary-green: #34d399;
      --gold-accent: #fbbf24;
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-glow: rgba(52, 211, 153, 0.25);
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', 'Outfit', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 60%, #030712 100%);
      color: #f8fafc;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
    }

    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* Floating UI Overlay */
    .ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.25rem;
      z-index: 10;
    }

    /* Top Bar Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      pointer-events: auto;
    }

    .title-badge {
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .avatar-icon {
      font-size: 1.75rem;
      filter: drop-shadow(0 2px 8px rgba(251, 191, 36, 0.5));
      animation: gentle-wobble 3s infinite ease-in-out;
    }

    @keyframes gentle-wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg) scale(1.05); }
      75% { transform: rotate(8deg) scale(1.05); }
    }

    .title-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #a7f3d0 0%, #34d399 50%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-text p {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-btn {
      width: 2.75rem;
      height: 2.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border-radius: 0.85rem;
      color: #f1f5f9;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      pointer-events: auto;
    }

    .icon-btn:hover {
      transform: translateY(-2px) scale(1.05);
      border-color: rgba(255,255,255,0.3);
      box-shadow: 0 8px 20px var(--glass-glow);
    }

    .icon-btn:active {
      transform: translateY(1px) scale(0.96);
    }

    /* Happiness & Affection Meter */
    .affection-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }

    .affection-card {
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-radius: 9999px;
    }

    .affection-bar-bg {
      width: 140px;
      height: 10px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .affection-bar-fill {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #ec4899, #f43f5e, #fbbf24);
      border-radius: 9999px;
      transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
    }

    .affection-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fda4af;
      letter-spacing: 0.02em;
    }

    /* Interactive Live Tip Banner */
    .tip-banner {
      align-self: center;
      padding: 0.45rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 9999px;
      animation: pulse-glow 3s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
      50% { box-shadow: 0 4px 25px rgba(52, 211, 153, 0.35); }
    }

    /* Bottom Control Dashboard */
    .bottom-dock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }

    /* Action Buttons Row */
    .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .pill-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border-radius: 9999px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .pill-btn:hover {
      transform: translateY(-3px) scale(1.04);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 10px 25px var(--glass-glow);
    }

    .pill-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    .btn-pet {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.5), rgba(244, 63, 94, 0.7));
      border-color: rgba(244, 63, 94, 0.6);
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4);
    }
    .btn-pet:hover {
      box-shadow: 0 10px 30px rgba(244, 63, 94, 0.6);
    }

    .btn-tease {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.5), rgba(126, 34, 206, 0.7));
      border-color: rgba(168, 85, 247, 0.6);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
    }

    .btn-feed {
      background: linear-gradient(135deg, rgba(251, 146, 60, 0.5), rgba(234, 88, 12, 0.7));
      border-color: rgba(251, 146, 60, 0.6);
      box-shadow: 0 6px 20px rgba(251, 146, 60, 0.4);
    }

    .btn-accessory {
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.5), rgba(202, 138, 4, 0.7));
      border-color: rgba(250, 204, 21, 0.6);
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.4);
    }

    /* Pet Switcher Dock */
    .switcher-card {
      width: 100%;
      padding: 0.6rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1rem;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 0.85rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    .pet-info {
      text-align: center;
      flex-grow: 1;
    }

    .pet-name-display {
      font-size: 1.1rem;
      font-weight: 800;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .pet-subtitle {
      font-size: 0.76rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .dot-indicators {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.25);
      transition: all 0.3s;
    }

    .dot.active {
      width: 18px;
      background: var(--primary-green);
      box-shadow: 0 0 8px var(--primary-green);
    }

    /* Floating speech bubble or petting popups */
    .speech-bubble {
      position: absolute;
      top: 32%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      padding: 0.6rem 1.2rem;
      border-radius: 1.2rem;
      font-size: 0.95rem;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
      opacity: 0;
      z-index: 20;
      white-space: nowrap;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.95) transparent;
      display: block;
      width: 0;
    }

    .speech-bubble.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .ui-container {
        padding: 0.75rem;
      }
      .title-text h1 {
        font-size: 1.05rem;
      }
      .title-text p {
        display: none;
      }
      .pill-btn {
        padding: 0.55rem 0.9rem;
        font-size: 0.82rem;
      }
      .nav-btn span {
        display: none;
      }
      .nav-btn {
        padding: 0.55rem 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Three.js Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Speech/Reactions Bubble -->
  <div id="speech-bubble" class="speech-bubble">Purrr... ✨ So cozy!</div>

  <!-- UI Overlay -->
  <div class="ui-container">
    
    <!-- Header -->
    <header class="header-bar">
      <div class="glass-card title-badge">
        <div class="avatar-icon">🦖</div>
        <div class="title-text">
          <h1>Rexy's Kingdom</h1>
          <p>Interactive 3D Baby Dino Pet</p>
        </div>
      </div>

      <div class="top-controls">
        <button id="btn-audio-toggle" class="icon-btn" title="Toggle Sound">🔊</button>
        <button id="btn-reset-cam" class="icon-btn" title="Reset View">🎥</button>
      </div>
    </header>

    <!-- Affection Meter & Live Tip -->
    <div class="affection-wrap">
      <div class="glass-card affection-card">
        <span style="font-size: 1.1rem;">💖</span>
        <div class="affection-bar-bg">
          <div id="affection-fill" class="affection-bar-fill"></div>
        </div>
        <span id="affection-text" class="affection-label">Affection 40%</span>
      </div>

      <div class="glass-card tip-banner">
        <span>✨</span>
        <span id="tip-text">Pet Rexy's head or tease him to play!</span>
      </div>
    </div>

    <!-- Bottom Controls & Switcher -->
    <footer class="bottom-dock">
      
      <!-- Interactive Action Buttons -->
      <div class="action-row">
        <button id="btn-pet-action" class="pill-btn btn-pet">
          <span>💖</span> Pet Head
        </button>
        <button id="btn-tease-action" class="pill-btn btn-tease">
          <span>🪶</span> Tease & Hop
        </button>
        <button id="btn-feed-action" class="pill-btn btn-feed">
          <span>🍓</span> Feed Snack
        </button>
        <button id="btn-accessory-toggle" class="pill-btn btn-accessory">
          <span>👑</span> Glasses & Crown
        </button>
      </div>

      <!-- Next / Previous Pet Switcher -->
      <div class="glass-card switcher-card">
        <button id="btn-prev-pet" class="nav-btn" title="Previous Pet">
          <span>❮</span> <span>Previous</span>
        </button>

        <div class="pet-info">
          <div id="pet-name-display" class="pet-name-display">
            <span>👑 Rexy the Baby Dino</span>
          </div>
          <div id="pet-subtitle" class="pet-subtitle">Emerald Cutie • Loves head rubs</div>
          <div class="dot-indicators">
            <div id="dot-0" class="dot active"></div>
            <div id="dot-1" class="dot"></div>
            <div id="dot-2" class="dot"></div>
          </div>
        </div>

        <button id="btn-next-pet" class="nav-btn" title="Next Pet">
          <span>Next</span> <span>❯</span>
        </button>
      </div>

    </footer>
  </div>

  <script>
    /* ==========================================================================
       SYNTHESIZED WEB AUDIO ENGINE
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.purrSource = null;
        this.purrGain = null;
        this.purrLfo = null;
        this.isPurring = false;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startPurr() {
        if (this.isMuted || this.isPurring) return;
        this.initContext();
        try {
          const now = this.ctx.currentTime;
          this.isPurring = true;

          this.purrOsc = this.ctx.createOscillator();
          this.purrOsc.type = 'triangle';
          this.purrOsc.frequency.setValueAtTime(45, now);

          this.purrSub = this.ctx.createOscillator();
          this.purrSub.type = 'sine';
          this.purrSub.frequency.setValueAtTime(28, now);

          this.purrLfo = this.ctx.createOscillator();
          this.purrLfo.type = 'sine';
          this.purrLfo.frequency.setValueAtTime(22, now);

          const lfoGain = this.ctx.createGain();
          lfoGain.gain.setValueAtTime(0.4, now);

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(280, now);

          this.purrGain = this.ctx.createGain();
          this.purrGain.gain.setValueAtTime(0.001, now);
          this.purrGain.gain.linearRampToValueAtTime(0.28, now + 0.15);

          this.purrLfo.connect(lfoGain.gain);
          this.purrOsc.connect(filter);
          this.purrSub.connect(filter);
          filter.connect(this.purrGain);
          this.purrGain.connect(this.ctx.destination);

          this.purrOsc.start(now);
          this.purrSub.start(now);
          this.purrLfo.start(now);
        } catch (e) {
          console.warn('Audio startPurr error:', e);
        }
      }

      stopPurr() {
        if (!this.isPurring || !this.purrGain || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          this.purrGain.gain.linearRampToValueAtTime(0.001, now + 0.12);
          setTimeout(() => {
            if (this.purrOsc) {
              try { this.purrOsc.stop(); this.purrOsc.disconnect(); } catch (e) {}
            }
            if (this.purrSub) {
              try { this.purrSub.stop(); this.purrSub.disconnect(); } catch (e) {}
            }
            if (this.purrLfo) {
              try { this.purrLfo.stop(); this.purrLfo.disconnect(); } catch (e) {}
            }
            this.isPurring = false;
          }, 140);
        } catch (e) {
          this.isPurring = false;
        }
      }

      playSqueak(pitchModifier = 1.0) {
        if (this.isMuted) return;
        this.initContext();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          const baseFreq = 750 * pitchModifier;
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.85, now + 0.08);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.1, now + 0.22);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.28, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.25);
        } catch (e) {}
      }

      playBoing() {
        if (this.isMuted) return;
        this.initContext();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(460, now + 0.14);
          osc.frequency.exponentialRampToValueAtTime(280, now + 0.32);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.36);
        } catch (e) {}
      }

      playChomp() {
        if (this.isMuted) return;
        this.initContext();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(90, now + 0.1);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.13);
        } catch (e) {}
      }

      playChime() {
        if (this.isMuted) return;
        this.initContext();
        try {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, index) => {
            const now = this.ctx.currentTime + index * 0.07;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now);
            osc.stop(now + 0.4);
          });
        } catch (e) {}
      }

      playHeartPop() {
        if (this.isMuted) return;
        this.initContext();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          const pitch = 900 + Math.random() * 400;
          osc.frequency.setValueAtTime(pitch, now);
          osc.frequency.exponentialRampToValueAtTime(pitch * 1.5, now + 0.06);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================================
       THREE.JS 3D SCENE, RENDERER, & LIGHTING SYSTEM
       ========================================================================== */
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0f172a, 0.038);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    const defaultCamPos = new THREE.Vector3(0, 1.8, 6.2);
    camera.position.copy(defaultCamPos);
    camera.lookAt(0, 1.3, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.72);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x1e1b4b, 0.65);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.35);
    dirLight.position.set(4, 8, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;

    for (let i = 0; i < starCount; i++) {

    /* ==========================================================================
       3D HEART PARTICLE GENERATOR
       ========================================================================== */
    const heartShape = new THREE.Shape();
    heartShape.moveTo(0, 0.3);
    heartShape.bezierCurveTo(0, 0.3, -0.3, 0.8, -0.7, 0.8);
    heartShape.bezierCurveTo(-1.1, 0.8, -1.1, 0.3, -1.1, 0.3);
    heartShape.bezierCurveTo(-1.1, -0.2, -0.6, -0.65, 0, -1.1);
    heartShape.bezierCurveTo(0.6, -0.65, 1.1, -0.2, 1.1, 0.3);
    heartShape.bezierCurveTo(1.1, 0.3, 1.1, 0.8, 0.7, 0.8);
    heartShape.bezierCurveTo(0.3, 0.8, 0, 0.3, 0, 0.3);

    const heartExtrudeSettings = {
      depth: 0.15,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.06,
      bevelThickness: 0.06
    };
    const heartGeo = new THREE.ExtrudeGeometry(heartShape, heartExtrudeSettings);
    heartGeo.scale(0.18, 0.18, 0.18);
    heartGeo.center();

    const heartColors = [0xf43f5e, 0xec4899, 0xfb7185, 0xf472b6, 0xfbbf24];
    const heartMaterials = heartColors.map(c => new THREE.MeshStandardMaterial({
      color: c,
      emissive: c,
      emissiveIntensity: 0.5,
      roughness: 0.25,
      metalness: 0.15
    }));

    const activeHearts = [];

    function spawnHeart(originPos) {
      const mat = heartMaterials[Math.floor(Math.random() * heartMaterials.length)];
      const heart = new THREE.Mesh(heartGeo, mat);
      
      heart.position.copy(originPos);
      heart.position.x += (Math.random() - 0.5) * 0.7;
      heart.position.y += (Math.random() - 0.2) * 0.5;
      heart.position.z += (Math.random() - 0.5) * 0.7;

      const initScale = 0.4 + Math.random() * 0.6;
      heart.scale.setScalar(0.01);

      const vx = (Math.random() - 0.5) * 0.035;
      const vy = 0.045 + Math.random() * 0.04;
      const vz = (Math.random() - 0.5) * 0.035;

      const rotSpeedX = (Math.random() - 0.5) * 0.08;
      const rotSpeedY = (Math.random() - 0.5) * 0.08;
      const rotSpeedZ = (Math.random() - 0.5) * 0.08;

      scene.add(heart);
      activeHearts.push({
        mesh: heart,
        vx, vy, vz,
        rotSpeedX, rotSpeedY, rotSpeedZ,
        targetScale: initScale,
        life: 1.0,
        age: 0
      });

      sound.playHeartPop();
    }

    function updateHearts(delta) {
      for (let i = activeHearts.length - 1; i >= 0; i--) {
        const h = activeHearts[i];
        h.age += delta;
        h.mesh.position.x += h.vx;
        h.mesh.position.y += h.vy;
        h.mesh.position.z += h.vz;

        h.mesh.rotation.x += h.rotSpeedX;
        h.mesh.rotation.y += h.rotSpeedY;
        h.mesh.rotation.z += h.rotSpeedZ;

        if (h.age < 0.2) {
          const s = (h.age / 0.2) * h.targetScale;
          h.mesh.scale.setScalar(s);
        } else {
          h.life -= delta * 0.9;
          const s = Math.max(0.001, h.life * h.targetScale);
          h.mesh.scale.setScalar(s);
        }

        if (h.life <= 0 || h.mesh.position.y > 6.0) {
          scene.remove(h.mesh);
          activeHearts.splice(i, 1);
        }
      }
    }

    /* ==========================================================================
       PET 1: REXY - THE BABY DINO

    function createRexyDino() {

      const bodyGeo = new THREE.SphereGeometry(1.0, 32, 24);

      const bellyGeo = new THREE.SphereGeometry(0.72, 24, 18);

      const spotGeo = new THREE.SphereGeometry(0.16, 12, 12);
      spotGeo.scale(1.0, 0.7, 0.3);
      const spotsPos = [[-0.42, 1.6, -0.65], [0.45, 1.45, -0.68], [-0.35, 1.15, -0.78], [0.32, 1.05, -0.75]];
      spotsPos.forEach(p => {
        const spot = new THREE.Mesh(spotGeo, darkSpotMat);
        spot.position.set(...p);
        spot.rotation.y = Math.PI;
        bodyGroup.add(spot);
      });

      const legGroupL = new THREE.Group();
      const legGroupR = new THREE.Group();
      legGroupL.position.set(-0.68, 0.55, 0.1);
      legGroupR.position.set(0.68, 0.55, 0.1);
      root.add(legGroupL, legGroupR);

      function buildLeg(pGroup) {
        const thighGeo = new THREE.SphereGeometry(0.44, 20, 16);
        thighGeo.scale(0.7, 0.95, 0.85);
        const thigh = new THREE.Mesh(thighGeo, skinMat);
        thigh.castShadow = true;
        pGroup.add(thigh);

        const footGeo = new THREE.SphereGeometry(0.38, 20, 16);
        footGeo.scale(0.75, 0.42, 1.15);
        const foot = new THREE.Mesh(footGeo, skinMat);
        foot.position.set(0, -0.32, 0.18);
        foot.castShadow = true;
        pGroup.add(foot);

        for (let i = -1; i <= 1; i++) {
          const clawGeo = new THREE.ConeGeometry(0.065, 0.15, 10);
          const claw = new THREE.Mesh(clawGeo, clawMat);
          claw.position.set(i * 0.16, -0.34, 0.58);
          claw.rotation.x = Math.PI / 2 + 0.2;
          pGroup.add(claw);
        }
      }
      buildLeg(legGroupL);
      buildLeg(legGroupR);

      const armGroupL = new THREE.Group();
      const armGroupR = new THREE.Group();
      armGroupL.position.set(-0.78, 1.35, 0.5);
      armGroupR.position.set(0.78, 1.35, 0.5);
      root.add(armGroupL, armGroupR);

      function buildArm(pGroup, isLeft) {
        const armGeo = new THREE.CylinderGeometry(0.11, 0.16, 0.42, 14);
        const arm = new THREE.Mesh(armGeo, skinMat);
        arm.position.set(isLeft ? -0.06 : 0.06, -0.08, 0.1);
        arm.rotation.x = -Math.PI / 4;
        arm.rotation.z = isLeft ? 0.3 : -0.3;
        arm.castShadow = true;
        pGroup.add(arm);

        for (let i = -0.5; i <= 0.5; i += 1.0) {
          const cGeo = new THREE.ConeGeometry(0.045, 0.11, 8);
          const c = new THREE.Mesh(cGeo, clawMat);
          c.position.set(i * 0.09, -0.22, 0.26);
          c.rotation.x = -Math.PI / 3;
          pGroup.add(c);
        }
      }
      buildArm(armGroupL, true);
      buildArm(armGroupR, false);

      const tailRoot = new THREE.Group();
      tailRoot.position.set(0, 0.85, -0.72);
      root.add(tailRoot);

      const tailMid = new THREE.Group();
      tailMid.position.set(0, -0.05, -0.5);
      tailRoot.add(tailMid);

      const tailTip = new THREE.Group();
      tailTip.position.set(0, 0.05, -0.45);
      tailMid.add(tailTip);

      const t1Geo = new THREE.CylinderGeometry(0.32, 0.52, 0.6, 16);
      t1Geo.rotateX(-Math.PI / 2);
      const t1 = new THREE.Mesh(t1Geo, skinMat);
      t1.castShadow = true;
      tailRoot.add(t1);

      const t2Geo = new THREE.CylinderGeometry(0.18, 0.32, 0.55, 16);
      t2Geo.rotateX(-Math.PI / 2);
      const t2 = new THREE.Mesh(t2Geo, skinMat);
      t2.castShadow = true;
      tailMid.add(t2);

      const t3Geo = new THREE.ConeGeometry(0.18, 0.5, 14);
      t3Geo.rotateX(-Math.PI / 2);
      const t3 = new THREE.Mesh(t3Geo, skinMat);
      t3.castShadow = true;
      tailTip.add(t3);

      const tailSpikeGeo = new THREE.ConeGeometry(0.12, 0.28, 8);
      const s1 = new THREE.Mesh(tailSpikeGeo, spikeMat);
      s1.position.set(0, 0.34, -0.2);
      s1.rotation.x = -0.3;
      tailRoot.add(s1);

      const s2 = new THREE.Mesh(tailSpikeGeo, spikeMat);
      s2.position.set(0, 0.25, -0.2);
      s2.rotation.x = -0.4;
      tailMid.add(s2);

      const s3 = new THREE.Mesh(tailSpikeGeo, spikeMat);
      s3.position.set(0, 0.16, -0.15);
      s3.rotation.x = -0.5;
      tailTip.add(s3);

      const headPivot = new THREE.Group();
      headPivot.position.set(0, 2.15, 0.15);
      root.add(headPivot);

      const headGroup = new THREE.Group();
      headPivot.add(headGroup);

      const headGeo = new THREE.SphereGeometry(0.96, 32, 24);
      headGeo.scale(1.15, 1.02, 1.1);
      const headMesh = new THREE.Mesh(headGeo, skinMat);
      headMesh.castShadow = true;
      headMesh.userData.isHead = true;
      headGroup.add(headMesh);

      const snoutGeo = new THREE.SphereGeometry(0.68, 24, 20);
      snoutGeo.scale(0.88, 0.65, 0.95);
      const snoutMesh = new THREE.Mesh(snoutGeo, skinMat);
      snoutMesh.position.set(0, -0.2, 0.85);
      snoutMesh.castShadow = true;
      snoutMesh.userData.isHead = true;
      headGroup.add(snoutMesh);

      const mouthGeo = new THREE.TorusGeometry(0.24, 0.038, 10, 24, Math.PI * 0.75);
      const mouthMat = new THREE.MeshBasicMaterial({ color: 0x14532d });
      const mouthMesh = new THREE.Mesh(mouthGeo, mouthMat);
      mouthMesh.position.set(0, -0.4, 1.18);
      mouthMesh.rotation.x = Math.PI / 2 + 0.15;
      mouthMesh.rotation.z = Math.PI * 0.625;
      headGroup.add(mouthMesh);

      const nostrilGeo = new THREE.SphereGeometry(0.045, 10, 10);
      const nostrilMat = new THREE.MeshBasicMaterial({ color: 0x166534 });
      const nL = new THREE.Mesh(nostrilGeo, nostrilMat);
      const nR = new THREE.Mesh(nostrilGeo, nostrilMat);
      nL.position.set(-0.14, -0.06, 1.42);
      nR.position.set(0.14, -0.06, 1.42);
      headGroup.add(nL, nR);

      const cheekGeo = new THREE.SphereGeometry(0.22, 16, 16);
      cheekGeo.scale(0.8, 0.5, 0.2);
      const cheekL = new THREE.Mesh(cheekGeo, blushMat);
      const cheekR = new THREE.Mesh(cheekGeo, blushMat);
      cheekL.position.set(-0.76, -0.2, 0.68);
      cheekL.rotation.y = -0.55;
      cheekR.position.set(0.76, -0.2, 0.68);
      cheekR.rotation.y = 0.55;
      headGroup.add(cheekL, cheekR);

      for (let i = 0; i < 3; i++) {
        const crestGeo = new THREE.ConeGeometry(0.18 - i * 0.02, 0.38, 10);
        const crest = new THREE.Mesh(crestGeo, spikeMat);
        crest.position.set(0, 0.85 - i * 0.3, -0.3 - i * 0.42);

      eyeL.rotation.y = -0.22;
      eyeR.rotation.y = 0.22;
      headGroup.add(eyeL, eyeR);

      function buildEye(parentEye) {
        const whiteGeo = new THREE.SphereGeometry(0.32, 24, 20);
        const white = new THREE.Mesh(whiteGeo, eyeWhiteMat);
        parentEye.add(white);

        const pupilCont = new THREE.Group();

      templeR.position.set(0.62, 0.04, -0.35);
      templeR.rotation.y = -0.2;

      sunglassGroup.add(lensL, lensR, frameL, frameR, bridge, templeL, templeR);

      return {

        root,

        headPivot,
        headGroup,

        legGroupR,

      legGroupR.position.set(0.45, 0.3, 0.1);
      root.add(legGroupL, legGroupR);

      function buildChickFoot(pGroup) {
        const footGeo = new THREE.BoxGeometry(0.36, 0.12, 0.55);
        const foot = new THREE.Mesh(footGeo, beakMat);
        foot.castShadow = true;
        pGroup.add(foot);
      }
      buildChickFoot(legGroupL);
      buildChickFoot(legGroupR);

      const tailRoot = new THREE.Group();
      tailRoot.position.set(0, 1.25, -1.0);
      root.add(tailRoot);
      const tailGeo = new THREE.ConeGeometry(0.24, 0.6, 8);
      tailGeo.rotateX(Math.PI / 3);
      const tailMesh = new THREE.Mesh(tailGeo, featherMat);
      tailRoot.add(tailMesh);
      const tailMid = new THREE.Group();
      const tailTip = new THREE.Group();

      const headPivot = new THREE.Group();
      headPivot.position.set(0, 2.1, 0.1);
      root.add(headPivot);

      const headGroup = new THREE.Group();
      headPivot.add(headGroup);

      const headGeo = new THREE.SphereGeometry(0.85, 32, 24);
      const headMesh = new THREE.Mesh(headGeo, featherMat);
      headMesh.castShadow = true;
      headMesh.userData.isHead = true;
      headGroup.add(headMesh);

      const beakGeo = new THREE.ConeGeometry(0.22, 0.42, 12);
      beakGeo.rotateX(Math.PI / 2);
      const beak = new THREE.Mesh(beakGeo, beakMat);
      beak.position.set(0, -0.05, 0.88);
      beak.castShadow = true;
      beak.userData.isHead = true;
      headGroup.add(beak);

      const cheekGeo = new THREE.SphereGeometry(0.18, 14, 14);
      cheekGeo.scale(0.8, 0.4, 0.2);
      const cL = new THREE.Mesh(cheekGeo, blushMat);
      const cR = new THREE.Mesh(cheekGeo, blushMat);
      cL.position.set(-0.62, -0.12, 0.55);
      cR.position.set(0.62, -0.12, 0.55);
      headGroup.add(cL, cR);

      const eyeL = new THREE.Group();
      const eyeR = new THREE.Group();
      eyeL.position.set(-0.42, 0.22, 0.68);
      eyeR.position.set(0.42, 0.22, 0.68);
      headGroup.add(eyeL, eyeR);

      function buildChickEye(pEye) {
        const pupilCont = new THREE.Group();
        pEye.add(pupilCont);

        const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.2, 18, 16), eyeMat);
        pupilCont.add(sphere);

        const glint = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 10), glintMat);
        glint.position.set(0.05, 0.06, 0.15);
        pupilCont.add(glint);

        const eyelidGeo = new THREE.SphereGeometry(0.22, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2);
        eyelidGeo.rotateX(-Math.PI / 2);
        const eyelid = new THREE.Mesh(eyelidGeo, featherMat);
        eyelid.scale.set(1.02, 0.001, 1.02);
        pEye.add(eyelid);

        return { pupilCont, eyelid };
      }
      const leftEye = buildChickEye(eyeL);
      const rightEye = buildChickEye(eyeR);

      const crownGroup = new THREE.Group();
      crownGroup.position.set(0, 0.88, 0);
      headGroup.add(crownGroup);

      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2;
        const pet = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 10), flowerMat);
        pet.position.set(Math.cos(angle) * 0.28, 0, Math.sin(angle) * 0.28);
        crownGroup.add(pet);
      }
      const flowerCenter = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 10), flowerCenterMat);
      crownGroup.add(flowerCenter);

      const sunglassGroup = new THREE.Group();

      return {
        group: chickGroup,
        root,
        bodyGroup,
        headPivot,
        headGroup,
        headMesh,
        legGroupL,
        legGroupR,
        armGroupL,
        armGroupR,
        tailRoot,
        tailMid,
        tailTip,
        leftEye,
        rightEye,
        crownGroup,
        sunglassGroup,
        type: 'chick'
      };
    }

    /* ==========================================================================
       PET 3: MOCHI - THE BUNNY
       ========================================================================== */
    function createMochiBunny() {
      const bunnyGroup = new THREE.Group();
      bunnyGroup.name = 'Mochi';

      const furMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.38 });
      const innerEarMat = new THREE.MeshStandardMaterial({ color: 0xfda4af, roughness: 0.42 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x3b0764, roughness: 0.1 });
      const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const noseMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.25 });
      const bowMat = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.3 });

      const root = new THREE.Group();
      bunnyGroup.add(root);

      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

      const bodyGeo = new THREE.SphereGeometry(1.0, 32, 24);
      bodyGeo.scale(1.05, 1.15, 1.05);
      const bodyMesh = new THREE.Mesh(bodyGeo, furMat);
      bodyMesh.position.set(0, 1.25, 0);
      bodyMesh.castShadow = true;
      bodyGroup.add(bodyMesh);

      const legGroupL = new THREE.Group();
      const legGroupR = new THREE.Group();
      legGroupL.position.set(-0.55, 0.4, 0.25);
      legGroupR.position.set(0.55, 0.4, 0.25);
      root.add(legGroupL, legGroupR);

      function buildPaw(pGroup) {
        const paw = new THREE.Mesh(new THREE.SphereGeometry(0.35, 18, 16), furMat);
        paw.scale.set(0.8, 0.5, 1.15);
        paw.castShadow = true;
        pGroup.add(paw);
      }
      buildPaw(legGroupL);
      buildPaw(legGroupR);

      const armGroupL = new THREE.Group();
      const armGroupR = new THREE.Group();
      armGroupL.position.set(-0.75, 1.35, 0.45);
      armGroupR.position.set(0.75, 1.35, 0.45);
      root.add(armGroupL, armGroupR);

      const armL = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 14), furMat);
      armL.scale.set(0.7, 1.1, 0.8);
      armGroupL.add(armL);

      const armR = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 14), furMat);
      armR.scale.set(0.7, 1.1, 0.8);
      armGroupR.add(armR);

      const tailRoot = new THREE.Group();
      tailRoot.position.set(0, 0.9, -0.95);
      root.add(tailRoot);
      const puff = new THREE.Mesh(new THREE.SphereGeometry(0.32, 18, 16), furMat);
      tailRoot.add(puff);
      const tailMid = new THREE.Group();
      const tailTip = new THREE.Group();

      const headPivot = new THREE.Group();
      headPivot.position.set(0, 2.15, 0.1);
      root.add(headPivot);

      const headGroup = new THREE.Group();
      headPivot.add(headGroup);

      const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.92, 32, 24), furMat);
      headMesh.scale.set(1.15, 1.02, 1.1);
      headMesh.castShadow = true;
      headMesh.userData.isHead = true;
      headGroup.add(headMesh);

      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), noseMat);
      nose.position.set(0, -0.05, 1.05);
      headGroup.add(nose);

      const earGroupL = new THREE.Group();
      const earGroupR = new THREE.Group();
      earGroupL.position.set(-0.45, 0.85, 0);
      earGroupR.position.set(0.45, 0.85, 0);
      headGroup.add(earGroupL, earGroupR);

      function buildEar(pEar, isLeft) {
        const outerEar = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.12, 1.4, 16), furMat);
        outerEar.position.y = 0.65;
        outerEar.scale.set(1.0, 1.0, 0.45);
        pEar.add(outerEar);

        const innerEar = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.08, 1.1, 14), innerEarMat);
        innerEar.position.set(0, 0.6, 0.04);
        innerEar.scale.set(1.0, 1.0, 0.35);
        pEar.add(innerEar);

        pEar.rotation.z = isLeft ? 0.35 : -0.35;
        pEar.rotation.x = -0.15;
      }
      buildEar(earGroupL, true);
      buildEar(earGroupR, false);

      const eyeL = new THREE.Group();
      const eyeR = new THREE.Group();
      eyeL.position.set(-0.44, 0.22, 0.72);
      eyeR.position.set(0.44, 0.22, 0.72);
      headGroup.add(eyeL, eyeR);

      function buildBunnyEye(pEye) {
        const pupilCont = new THREE.Group();
        pEye.add(pupilCont);

        const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 18), eyeMat);
        pupilCont.add(sphere);

        const glint = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), glintMat);
        glint.position.set(0.06, 0.07, 0.16);
        pupilCont.add(glint);

        const eyelidGeo = new THREE.SphereGeometry(0.24, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2);
        eyelidGeo.rotateX(-Math.PI / 2);
        const eyelid = new THREE.Mesh(eyelidGeo, furMat);
        eyelid.scale.set(1.02, 0.001, 1.02);
        pEye.add(eyelid);

        return { pupilCont, eyelid };
      }
      const leftEye = buildBunnyEye(eyeL);
      const rightEye = buildBunnyEye(eyeR);

      const crownGroup = new THREE.Group();
      crownGroup.position.set(0, -0.65, 0.85);
      headGroup.add(crownGroup);

      const knot = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), bowMat);
      crownGroup.add(knot);

      const wingConeGeo = new THREE.ConeGeometry(0.22, 0.36, 12);
      const bowL = new THREE.Mesh(wingConeGeo, bowMat);
      bowL.rotation.z = Math.PI / 2;
      bowL.position.x = -0.22;

      const bowR = new THREE.Mesh(wingConeGeo, bowMat);
      bowR.rotation.z = -Math.PI / 2;
      bowR.position.x = 0.22;
      crownGroup.add(bowL, bowR);

      const sunglassGroup = new THREE.Group();

      return {
        group: bunnyGroup,
        root,
        bodyGroup,
        headPivot,
        headGroup,
        headMesh,
        legGroupL,
        legGroupR,
        armGroupL,
        armGroupR,
        tailRoot,
        tailMid,
        tailTip,
        earGroupL,
        earGroupR,
        leftEye,
        rightEye,
        crownGroup,
        sunglassGroup,
        type: 'bunny'
      };
    }

    const petsData = [
      { name: '👑 Rexy the Baby Dino', subtitle: 'Emerald Cutie • Loves head rubs', creator: createRexyDino },
      { name: '🐥 Pip the Golden Chick', subtitle: 'Sunny Sweetheart • Chirpy hops', creator: createPipChick },
      { name: '🐰 Mochi the Celestial Bunny', subtitle: 'Cotton Cloud • Floppy ear bounces', creator: createMochiBunny }
    ];

    let currentPetIndex = 0;
    let currentPet = null;
    const petContainer = new THREE.Group();
    scene.add(petContainer);

    function loadPet(index, transitionDirection = 1) {
      currentPetIndex = (index + petsData.length) % petsData.length;
      const petInfo = petsData[currentPetIndex];

      if (currentPet) {
        sound.stopPurr();
        const oldPet = currentPet;
        let exitTime = 0;
        const animateExit = () => {
          exitTime += 0.05;
          oldPet.group.scale.subScalar(0.08);
          oldPet.group.rotation.y += 0.2 * transitionDirection;
          if (oldPet.group.scale.x <= 0.05) {
            petContainer.remove(oldPet.group);
          } else {
            requestAnimationFrame(animateExit);
          }
        };
        animateExit();
      }

      currentPet = petInfo.creator();
      petContainer.add(currentPet.group);

      currentPet.group.scale.setScalar(0.01);
      currentPet.group.rotation.y = -0.5 * transitionDirection;

      let enterTime = 0;
      const animateEnter = () => {
        enterTime += 0.06;
        const s = Math.min(1.0, enterTime * 1.5);
        currentPet.group.scale.setScalar(s);
        currentPet.group.rotation.y += 0.05 * transitionDirection;
        if (enterTime < 0.7) {
          requestAnimationFrame(animateEnter);
        } else {
          currentPet.group.scale.setScalar(1.0);
          currentPet.group.rotation.y = 0;
        }
      };
      animateEnter();

      document.getElementById('pet-name-display').innerHTML = `<span>${petInfo.name}</span>`;
      document.getElementById('pet-subtitle').textContent = petInfo.subtitle;
      
      for (let i = 0; i < petsData.length; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (dot) {
          if (i === currentPetIndex) dot.classList.add('active');
          else dot.classList.remove('active');
        }
      }

      sound.playChime();
      showSpeechBubble(`Hello! I'm ${petInfo.name.split(' ')[1]}! ✨`);
    }

    loadPet(0);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let isPointerDown = false;
    let isPettingHead = false;
    let pettingTimer = 0;
    let affectionLevel = 40;
    let lastHeartSpawn = 0;
    let teaseHopTime = 0;
    let isTeasing = false;

    let targetHeadRotY = 0;
    let targetHeadRotX = 0;
    let targetEyeShiftX = 0;
    let targetEyeShiftY = 0;

    let currentSquashY = 1.0;
    let targetSquashY = 1.0;

    const speechEl = document.getElementById('speech-bubble');
    let speechTimeout = null;

    function showSpeechBubble(text, duration = 2200) {
      speechEl.textContent = text;
      speechEl.classList.add('show');
      clearTimeout(speechTimeout);
      speechTimeout = setTimeout(() => {
        speechEl.classList.remove('show');
      }, duration);
    }

    function updateAffection(amount) {
      affectionLevel = Math.min(100, Math.max(0, affectionLevel + amount));
      document.getElementById('affection-fill').style.width = affectionLevel + '%';
      document.getElementById('affection-text').textContent = `Affection ${Math.round(affectionLevel)}%`;
      
      if (affectionLevel >= 100) {
        showSpeechBubble('💕 OVERFLOWING LOVE! 100% Bliss! 🎉');
        sound.playChime();
        for (let i = 0; i < 8; i++) {
          setTimeout(() => {
            if (currentPet) spawnHeart(currentPet.headPivot.position);
          }, i * 80);
        }
      }
    }

    function checkHeadHit(event) {
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      mouse.set(x, y);

      raycaster.setFromCamera(mouse, camera);
      if (!currentPet) return false;

      const intersects = raycaster.intersectObjects(currentPet.headGroup.children, true);
      for (const hit of intersects) {
        let obj = hit.object;
        while (obj) {
          if (obj.userData && obj.userData.isHead) return true;
          obj = obj.parent;
        }
      }
      return false;
    }

    canvas.addEventListener('pointerdown', (e) => {
      sound.initContext();
      isPointerDown = true;
      const hitHead = checkHeadHit(e);
      if (hitHead) {
        startPetting();
      } else {
        triggerTeaseHop();
      }
    });

    window.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const ny = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      mouse.set(nx, ny);

      targetHeadRotY = THREE.MathUtils.clamp(nx * 0.55, -0.65, 0.65);
      targetHeadRotX = THREE.MathUtils.clamp(-ny * 0.45, -0.45, 0.45);
      targetEyeShiftX = THREE.MathUtils.clamp(nx * 0.08, -0.06, 0.06);
      targetEyeShiftY = THREE.MathUtils.clamp(ny * 0.06, -0.05, 0.05);

      if (isPointerDown) {
        const hitHead = checkHeadHit(e);
        if (hitHead && !isPettingHead) {
          startPetting();
        } else if (!hitHead && isPettingHead) {
          stopPetting();
        }
      }
    });

    window.addEventListener('pointerup', () => {
      isPointerDown = false;
      stopPetting();
    });

    function startPetting() {
      if (isPettingHead) return;
      isPettingHead = true;
      targetSquashY = 0.78;
      sound.startPurr();
      showSpeechBubble('Purrrrr... 🥰 That tickles!');
      updateAffection(4);
    }

    function stopPetting() {
      if (!isPettingHead) return;
      isPettingHead = false;
      targetSquashY = 1.0;
      sound.stopPurr();
    }

    function triggerTeaseHop() {
      if (isTeasing) return;
      isTeasing = true;
      teaseHopTime = 0;
      sound.playSqueak(1.15);
      sound.playBoing();
      showSpeechBubble('Squeeeeek! 🦖✨ Catch me!');
      updateAffection(2);
    }

    function feedSnack() {
      if (!currentPet) return;
      sound.initContext();

      const berryGroup = new THREE.Group();
      const berryMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.35 });

      const bMesh = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.4, 14), berryMat);
      bMesh.rotation.x = Math.PI;
      berryGroup.add(bMesh);

      const leaf = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.02, 0.04, 6), leafMat);
      leaf.position.y = 0.2;
      berryGroup.add(leaf);

      berryGroup.position.set(0, 4.2, 1.2);
      scene.add(berryGroup);

      let fallTime = 0;
      const dropAnim = () => {
        fallTime += 0.06;
        berryGroup.position.y -= 0.12;
        berryGroup.rotation.x += 0.12;
        berryGroup.rotation.y += 0.15;

        if (berryGroup.position.y < 2.6 && currentPet) {
          currentPet.headGroup.rotation.x = -0.3;
        }

        if (berryGroup.position.y <= 1.8) {
          scene.remove(berryGroup);
          sound.playChomp();
          sound.playSqueak(0.9);
          showSpeechBubble('Nom nom nom! 🍓 Delicious!');
          updateAffection(8);

          targetSquashY = 0.82;
          setTimeout(() => { targetSquashY = 1.0; }, 280);
          if (currentPet) spawnHeart(currentPet.headPivot.position);
        } else {
          requestAnimationFrame(dropAnim);
        }
      };
      dropAnim();
    }

    let accessoriesVisible = true;
    function toggleAccessories() {
      if (!currentPet) return;
      accessoriesVisible = !accessoriesVisible;
      
      const targetScale = accessoriesVisible ? 1.0 : 0.001;
      if (currentPet.crownGroup) {
        currentPet.crownGroup.scale.setScalar(targetScale);
      }
      if (currentPet.sunglassGroup) {
        currentPet.sunglassGroup.scale.setScalar(targetScale);
      }

      sound.playChime();
      showSpeechBubble(accessoriesVisible ? 'Royal drip restored! 👑🕶️' : 'Casual comfy mode! 🌸');
    }

    document.getElementById('btn-prev-pet').addEventListener('click', () => { loadPet(currentPetIndex - 1, -1); });
    document.getElementById('btn-next-pet').addEventListener('click', () => { loadPet(currentPetIndex + 1, 1); });
    document.getElementById('btn-pet-action').addEventListener('click', () => {
      sound.initContext();
      startPetting();
      setTimeout(() => { stopPetting(); }, 1600);
    });
    document.getElementById('btn-tease-action').addEventListener('click', () => { triggerTeaseHop(); });
    document.getElementById('btn-feed-action').addEventListener('click', () => { feedSnack(); });
    document.getElementById('btn-accessory-toggle').addEventListener('click', () => { toggleAccessories(); });

    const audioBtn = document.getElementById('btn-audio-toggle');
    audioBtn.addEventListener('click', () => {
      sound.initContext();
      sound.isMuted = !sound.isMuted;
      audioBtn.textContent = sound.isMuted ? '🔇' : '🔊';
      if (sound.isMuted) sound.stopPurr();
    });

    document.getElementById('btn-reset-cam').addEventListener('click', () => {
      camera.position.copy(defaultCamPos);
      camera.lookAt(0, 1.3, 0);
      showSpeechBubble('Camera view reset! 🎥');
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') loadPet(currentPetIndex - 1, -1);
      if (e.key === 'ArrowRight') loadPet(currentPetIndex + 1, 1);
      if (e.key === ' ' || e.key === 'Spacebar') triggerTeaseHop();
      if (e.key.toLowerCase() === 'p') {
        startPetting();
        setTimeout(() => stopPetting(), 1200);
      }
      if (e.key.toLowerCase() === 'f') feedSnack();
    });

    let clock = new THREE.Clock();
    let blinkTimer = 0;
    let nextBlinkInterval = 3.2;
    let isBlinking = false;
    let blinkProgress = 0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      starData.forEach(st => {
        st.mesh.position.y = st.baseY + Math.sin(elapsed * st.speed + st.offset) * 0.18;
        st.mesh.rotation.x += 0.01;
        st.mesh.rotation.y += 0.015;
      });

      updateHearts(delta);

      if (currentPet) {
        if (isPettingHead) {
          pettingTimer += delta;
          if (elapsed - lastHeartSpawn > 0.14) {
            spawnHeart(currentPet.headPivot.position);
            lastHeartSpawn = elapsed;
          }
        }

        currentSquashY += (targetSquashY - currentSquashY) * 0.14;
        const volumeFactor = 1.0 / Math.sqrt(currentSquashY);

        currentPet.headPivot.scale.y = currentSquashY;
        currentPet.headPivot.scale.x = volumeFactor;
        currentPet.headPivot.scale.z = volumeFactor;

        currentPet.headGroup.rotation.y += (targetHeadRotY - currentPet.headGroup.rotation.y) * 0.08;
        currentPet.headGroup.rotation.x += (targetHeadRotX - currentPet.headGroup.rotation.x) * 0.08;

        if (currentPet.leftEye && currentPet.leftEye.pupilCont) {
          currentPet.leftEye.pupilCont.position.x = targetEyeShiftX;
          currentPet.leftEye.pupilCont.position.y = targetEyeShiftY;
        }
        if (currentPet.rightEye && currentPet.rightEye.pupilCont) {
          currentPet.rightEye.pupilCont.position.x = targetEyeShiftX;
          currentPet.rightEye.pupilCont.position.y = targetEyeShiftY;
        }

        blinkTimer += delta;
        if (isPettingHead) {
          if (currentPet.leftEye) currentPet.leftEye.eyelid.scale.y = 1.0;
          if (currentPet.rightEye) currentPet.rightEye.eyelid.scale.y = 1.0;
        } else {
          if (!isBlinking && blinkTimer > nextBlinkInterval) {
            isBlinking = true;
            blinkTimer = 0;
            blinkProgress = 0;
            nextBlinkInterval = 2.5 + Math.random() * 3.0;
          }
          if (isBlinking) {
            blinkProgress += delta * 12;
            const lidScale = Math.sin(blinkProgress * Math.PI);
            if (currentPet.leftEye) currentPet.leftEye.eyelid.scale.y = THREE.MathUtils.clamp(lidScale, 0.001, 1.0);
            if (currentPet.rightEye) currentPet.rightEye.eyelid.scale.y = THREE.MathUtils.clamp(lidScale, 0.001, 1.0);
            if (blinkProgress >= 1.0) {
              isBlinking = false;
              if (currentPet.leftEye) currentPet.leftEye.eyelid.scale.y = 0.001;
              if (currentPet.rightEye) currentPet.rightEye.eyelid.scale.y = 0.001;
            }
          }
        }

        const breath = Math.sin(elapsed * 2.2) * 0.035;
        currentPet.bodyGroup.scale.y = 1.0 + breath;
        currentPet.bodyGroup.scale.x = 1.0 - breath * 0.5;

        if (currentPet.tailRoot) {
          const wagSpeed = isPettingHead ? 10.0 : 3.5;
          const wagAmount = isPettingHead ? 0.35 : 0.18;
          currentPet.tailRoot.rotation.y = Math.sin(elapsed * wagSpeed) * wagAmount;
          if (currentPet.tailMid) currentPet.tailMid.rotation.y = Math.sin(elapsed * wagSpeed - 0.5) * (wagAmount * 1.3);
          if (currentPet.tailTip) currentPet.tailTip.rotation.y = Math.sin(elapsed * wagSpeed - 1.0) * (wagAmount * 1.6);
        }

        if (currentPet.armGroupL && currentPet.armGroupR) {
          const armWave = Math.sin(elapsed * 4.0) * 0.15;
          currentPet.armGroupL.rotation.x = armWave;
          currentPet.armGroupR.rotation.x = -armWave;
        }

        if (currentPet.type === 'bunny' && currentPet.earGroupL && currentPet.earGroupR) {
          const earBounce = Math.sin(elapsed * 3.0) * 0.12;
          currentPet.earGroupL.rotation.x = -0.15 + earBounce;
          currentPet.earGroupR.rotation.x = -0.15 + earBounce;
        }

        if (isTeasing) {
          teaseHopTime += delta * 4.5;
          const jumpHeight = Math.sin(teaseHopTime * Math.PI) * 1.35;
          if (jumpHeight > 0) {
            currentPet.root.position.y = jumpHeight;
            currentPet.root.scale.y = 1.0 + Math.sin(teaseHopTime * Math.PI) * 0.25;
            currentPet.root.rotation.y += delta * 4.0;
            currentPet.legGroupL.rotation.x = 0.5;
            currentPet.legGroupR.rotation.x = 0.5;
          } else {
            currentPet.root.position.y = 0;
            currentPet.root.scale.y = 0.85;
            currentPet.legGroupL.rotation.x = 0;
            currentPet.legGroupR.rotation.x = 0;
            isTeasing = false;
            setTimeout(() => {
              if (currentPet) currentPet.root.scale.y = 1.0;
            }, 180);
          }
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
